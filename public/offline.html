<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Você está offline · LumiHunter AI</title>
    <style>
      html, body {
        height: 100%;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        color: #131318;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        text-align: center;
        padding: 24px;
      }
      .card { max-width: 360px; }
      .badge {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        background: #F5BD14;
        margin: 0 auto 20px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      h1 { font-size: 1.25rem; margin: 0 0 8px; }
      p { font-size: 0.95rem; color: #6b6b76; margin: 0 0 20px; }
      button {
        border: none;
        background: #F5BD14;
        color: #131318;
        font-weight: 600;
        padding: 10px 20px;
        border-radius: 10px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="10" stroke="#131318" stroke-width="2" />
          <circle cx="12" cy="12" r="5.5" stroke="#131318" stroke-width="2" />
          <circle cx="12" cy="12" r="1.6" fill="#131318" />
        </svg>
      </div>
      <h1>Sem conexão</h1>
      <p>Não foi possível carregar o LumiHunter agora. Verifique sua internet e tente novamente.</p>
      <button onclick="location.reload()">Tentar de novo</button>
    </div>
  </body>
</html>
